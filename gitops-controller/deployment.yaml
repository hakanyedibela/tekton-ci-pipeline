---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitops-controller-sa
  namespace: default
  labels:
    app.kubernetes.io/name: gitops-controller

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitops-controller-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitops-controller-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: gitops-controller-sa
    namespace: default
roleRef:
  kind: Role
  name: gitops-controller-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-controller
  namespace: default
  labels:
    app.kubernetes.io/name: gitops-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitops-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitops-controller
    spec:
      serviceAccountName: gitops-controller-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: controller
          image: ghcr.io/yourorg/tekton-gitops-controller:latest
          imagePullPolicy: Always
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WATCH_CONFIG_MAP
              value: gitops-watch-config
            - name: STATE_CONFIG_MAP
              value: gitops-controller-state
            - name: GITHUB_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-api-token
                  key: token
                  optional: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
