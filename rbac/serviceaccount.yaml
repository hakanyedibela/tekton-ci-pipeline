---
# ServiceAccount for running Pipeline Tasks
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-pipeline-sa
  namespace: default
  labels:
    app.kubernetes.io/name: tekton-ci-pipeline
  annotations:
    # AWS: IRSA for ECR access (no static credentials needed)
    # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/tekton-pipeline-role
    # GKE: Workload Identity for Artifact Registry
    # iam.gke.io/gcp-service-account: tekton-pipeline@my-project.iam.gserviceaccount.com

---
# ServiceAccount for Tekton Triggers (creates PipelineRuns)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-triggers-sa
  namespace: default
  labels:
    app.kubernetes.io/name: tekton-ci-pipeline

---
# Role for Pipeline ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-pipeline-role
  namespace: default
rules:
  # Allow managing pipeline workloads
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["tekton.dev"]
    resources: ["tasks", "taskruns", "pipelines", "pipelineruns"]
    verbs: ["get", "list", "watch"]

---
# RoleBinding for Pipeline ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-pipeline-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: tekton-pipeline-sa
    namespace: default
roleRef:
  kind: Role
  name: tekton-pipeline-role
  apiGroup: rbac.authorization.k8s.io

---
# Role for Triggers ServiceAccount — only needs to create PipelineRuns
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-triggers-role
  namespace: default
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns"]
    verbs: ["create", "get", "list"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["eventlisteners", "triggerbindings", "triggertemplates", "triggers", "clusterinterceptors"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-triggers-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: tekton-triggers-sa
    namespace: default
roleRef:
  kind: Role
  name: tekton-triggers-role
  apiGroup: rbac.authorization.k8s.io

---
# ServiceAccount for GitOps polling controller
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitops-controller-sa
  namespace: default
  labels:
    app.kubernetes.io/name: tekton-ci-pipeline

---
# Role for GitOps controller: manage state ConfigMap, read watch config + secrets, create PipelineRuns
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitops-controller-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitops-controller-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: gitops-controller-sa
    namespace: default
roleRef:
  kind: Role
  name: gitops-controller-role
  apiGroup: rbac.authorization.k8s.io
