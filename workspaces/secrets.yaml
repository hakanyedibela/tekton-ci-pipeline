---
# GitHub webhook secret for HMAC validation
# Replace 'your-webhook-secret' with a strong random string
# Then configure the same value in GitHub webhook settings
apiVersion: v1
kind: Secret
metadata:
  name: github-webhook-secret
  labels:
    app.kubernetes.io/name: tekton-ci-pipeline
type: Opaque
stringData:
  # openssl rand -hex 32
  secret-token: "REPLACE_WITH_STRONG_RANDOM_SECRET"

---
# Docker registry credentials for Harbor
# Replace with your actual registry credentials
# Or use cloud IAM (IRSA/Workload Identity) to avoid static credentials
apiVersion: v1
kind: Secret
metadata:
  name: harbor-registry-secret
  labels:
    app.kubernetes.io/name: tekton-ci-pipeline
type: kubernetes.io/dockerconfigjson
stringData:
  # Create with:
  # kubectl create secret docker-registry harbor-registry-secret \
  #   --docker-server=harbor.example.com \
  #   --docker-username=robot-tekton \
  #   --docker-password=YOUR_TOKEN \
  #   --dry-run=client -o yaml > secrets.yaml
  .dockerconfigjson: |
    {
      "auths": {
        "harbor.example.com": {
          "username": "robot-tekton",
          "password": "REPLACE_WITH_HARBOR_TOKEN",
          "auth": "REPLACE_WITH_BASE64_OF_USER:PASS"
        }
      }
    }

---
# Git credentials for GitOps repo updates
# Option 1: HTTPS with token
apiVersion: v1
kind: Secret
metadata:
  name: gitops-git-credentials
  labels:
    app.kubernetes.io/name: tekton-ci-pipeline
type: Opaque
stringData:
  # Git config file — uses credential helper
  .gitconfig: |
    [credential]
      helper = store
    [user]
      email = tekton-ci@example.com
      name = Tekton CI
  # Credentials file — format: https://user:token@github.com
  .git-credentials: |
    https://tekton-bot:REPLACE_WITH_GITHUB_PAT@github.com

---
# Slack webhook for pipeline notifications
apiVersion: v1
kind: Secret
metadata:
  name: slack-webhook-secret
  labels:
    app.kubernetes.io/name: tekton-ci-pipeline
type: Opaque
stringData:
  webhook-url: "https://hooks.slack.com/services/REPLACE/WITH/YOUR_WEBHOOK_URL"

---
# GitHub Personal Access Token for GitOps controller (PR polling, API access)
# Replace with a fine-grained or classic PAT with repo:read scope
apiVersion: v1
kind: Secret
metadata:
  name: github-api-token
  labels:
    app.kubernetes.io/name: tekton-ci-pipeline
type: Opaque
stringData:
  token: "REPLACE_WITH_GITHUB_PAT"

---
# Maven settings.xml ConfigMap (for Nexus/Artifactory proxy)
apiVersion: v1
kind: ConfigMap
metadata:
  name: maven-settings
  labels:
    app.kubernetes.io/name: tekton-ci-pipeline
data:
  settings.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
      <mirrors>
        <mirror>
          <id>nexus</id>
          <mirrorOf>*</mirrorOf>
          <url>https://nexus.example.com/repository/maven-public/</url>
        </mirror>
      </mirrors>
      <servers>
        <server>
          <id>nexus</id>
          <username>ci-user</username>
          <password>${env.NEXUS_PASSWORD}</password>
        </server>
      </servers>
    </settings>
